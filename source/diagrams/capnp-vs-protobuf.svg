<svg viewBox="0 0 680 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capnp-vs-protobuf-title capnp-vs-protobuf-desc">
  <title id="capnp-vs-protobuf-title">Cap'n Proto 与 Protobuf 的字节布局对比</title>
  <desc id="capnp-vs-protobuf-desc">两行字节流对比：Cap'n Proto 由 struct info、data info、pointer info 三段组成，结构信息集中在头部、数据与指针分区存放，可按偏移量直接定位；Protobuf 由 fieldInfo 与 fieldData 成对交替排列，读取时只能顺序解析。</desc>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ══ 行 1 · Cap'n Proto ═════════════════════════════════ -->
  <text x="32" y="44" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">Cap&#39;n Proto</text>
  <text x="648" y="44" fill="#7d8187" font-size="8" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">RANDOM ACCESS</text>

  <rect x="32" y="56" width="616" height="56" rx="8" fill="#191919"/>
  <rect x="32" y="56" width="616" height="56" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="184" y1="56" x2="184" y2="112" stroke="#212327" stroke-width="1"/>
  <line x1="416" y1="56" x2="416" y2="112" stroke="#212327" stroke-width="1"/>

  <text x="108" y="80" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">struct info</text>
  <text x="108" y="96" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">字段声明与偏移</text>

  <text x="300" y="80" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">data info</text>
  <text x="300" y="96" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">定长字段数据</text>

  <text x="532" y="80" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">pointer info</text>
  <text x="532" y="96" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">变长数据指针</text>

  <!-- 分组括号：头部集中 + 分区存放 -->
  <path d="M 32 116 V 124 H 184 V 116" fill="none" stroke="#7d8187" stroke-width="0.8"/>
  <text x="108" y="140" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">头部集中声明</text>

  <path d="M 184 116 V 124 H 648 V 116" fill="none" stroke="#7d8187" stroke-width="0.8"/>
  <text x="416" y="140" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">数据段与指针段分区存放</text>

  <!-- ══ 行 2 · Protobuf ════════════════════════════════════ -->
  <text x="32" y="184" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">Protobuf</text>
  <text x="648" y="184" fill="#7d8187" font-size="8" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">SEQUENTIAL PARSE</text>

  <rect x="32" y="196" width="616" height="56" rx="8" fill="#191919"/>
  <rect x="32" y="196" width="616" height="56" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="128" y1="196" x2="128" y2="252" stroke="#212327" stroke-width="1"/>
  <line x1="340" y1="196" x2="340" y2="252" stroke="#212327" stroke-width="1"/>
  <line x1="436" y1="196" x2="436" y2="252" stroke="#212327" stroke-width="1"/>

  <!-- 重复出现的信息段（强调交替节奏） -->
  <rect x="36" y="200" width="88" height="48" rx="2" fill="none" stroke="#ff7a17" stroke-width="1"/>
  <rect x="344" y="200" width="88" height="48" rx="2" fill="none" stroke="#ff7a17" stroke-width="1"/>

  <text x="80" y="220" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">fieldInfo</text>
  <text x="80" y="236" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">字段号与类型</text>

  <text x="234" y="220" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">fieldData</text>
  <text x="234" y="236" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">该字段的值</text>

  <text x="388" y="220" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">fieldInfo</text>
  <text x="388" y="236" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">字段号与类型</text>

  <text x="542" y="220" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">fieldData</text>
  <text x="542" y="236" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">该字段的值</text>

  <!-- 分组括号：成对，且重复交替 -->
  <path d="M 32 256 V 264 H 340 V 256" fill="none" stroke="#7d8187" stroke-width="0.8"/>
  <text x="186" y="280" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">一对：信息紧跟数据</text>

  <path d="M 340 256 V 264 H 648 V 256" fill="none" stroke="#7d8187" stroke-width="0.8"/>
  <text x="494" y="280" fill="#7d8187" font-size="8" text-anchor="middle" font-family="'Inter', sans-serif">下一对：同样结构重复交替</text>
</svg>
