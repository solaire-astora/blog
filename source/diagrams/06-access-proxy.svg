<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-proxy-title access-proxy-desc">
  <title id="access-proxy-title">access_proxy 由 ia_ 反推 proxy 并交给 proxy_invoke</title>
  <desc id="access-proxy-desc">在 proxy 通过成员 ia_ 与 MemAt::accessor 获得 at 方法的链路上，accessor::at 先用 access_proxy 按 ia_ 的成员偏移量反推出 pro::proxy&lt;Dictionary&gt;&amp; ，再连同 idx 交给 proxy_invoke；proxy_invoke 如何落到 std::map::at 仍未揭晓。</desc>

  <defs>
    <marker id="d6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
    <marker id="d6-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff7a17"/>
    </marker>
  </defs>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ── 箭头（先画，z-order 在节点之下） ───────────────────── -->
  <line x1="96" y1="144" x2="96" y2="176" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <line x1="96" y1="228" x2="96" y2="260" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <line x1="96" y1="312" x2="96" y2="344" stroke="#ff7a17" stroke-width="1.2" marker-end="url(#d6-arrow-accent)"/>
  <line x1="96" y1="396" x2="96" y2="428" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <line x1="96" y1="468" x2="96" y2="500" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <!-- ── 回指箭头：accessor 用指针位移反推出 proxy&（r=8 圆角折线） ── -->
  <path d="M 608 288 H 624 Q 632 288 632 280 V 104 Q 632 96 624 96 H 432"
        fill="none" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <!-- ── 箭头标签（mask 落在节点之外的空白段） ──────────────── -->
  <rect x="108" y="152" width="36" height="12" rx="2" fill="#191919"/>
  <text x="112" y="161" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">ia_</text>

  <rect x="108" y="236" width="76" height="12" rx="2" fill="#191919"/>
  <text x="112" y="245" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">INHERITS</text>

  <rect x="108" y="320" width="140" height="12" rx="2" fill="#191919"/>
  <text x="112" y="329" fill="#ff7a17" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">(access_proxy(*this), idx)</text>

  <rect x="428" y="236" width="188" height="12" rx="2" fill="#191919"/>
  <text x="432" y="245" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">access_proxy: -offsetof(proxy&lt;F&gt;, ia_)</text>

  <!-- ══ N1 · pro::proxy<Dictionary> ═════════════════════════ -->
  <rect x="32" y="48" width="400" height="96" rx="8" fill="#191919"/>
  <rect x="32" y="48" width="400" height="96" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="48" y="70" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">pro::proxy&lt;Dictionary&gt;</text>
  <line x1="32" y1="82" x2="432" y2="82" stroke="#212327" stroke-width="1"/>
  <text x="48" y="100" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">- ia_ : details::facade_traits&lt;Dictionary&gt;::indirect_accessor</text>
  <line x1="32" y1="112" x2="432" y2="112" stroke="#212327" stroke-width="1"/>
  <text x="48" y="132" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ operator-&gt;()    + operator*()</text>

  <!-- ══ N2 · indirect_accessor ══════════════════════════════ -->
  <rect x="32" y="176" width="376" height="52" rx="8" fill="#191919"/>
  <rect x="32" y="176" width="376" height="52" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="48" y="198" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">details::facade_traits&lt;Dictionary&gt;::indirect_accessor</text>
  <line x1="32" y1="210" x2="408" y2="210" stroke="#212327" stroke-width="1"/>
  <text x="48" y="223" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ std::string at(int)</text>

  <!-- ══ N3 · MemAt::accessor ═══════════════════════════════ -->
  <rect x="32" y="260" width="576" height="52" rx="8" fill="#191919"/>
  <rect x="32" y="260" width="576" height="52" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="48" y="282" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">MemAt::accessor&lt;Dictionary, conv_impl&lt;false, MemAt, std::string(int)&gt;, std::string(int)&gt;</text>
  <line x1="32" y1="294" x2="608" y2="294" stroke="#212327" stroke-width="1"/>
  <text x="48" y="307" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ std::string at(int)</text>

  <!-- ══ N4 · proxy_invoke（本图新揭晓的一环） ══════════════ -->
  <rect x="32" y="344" width="392" height="52" rx="8" fill="#191919"/>
  <rect x="32" y="344" width="392" height="52" rx="8" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="48" y="366" fill="#ff7a17" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">proxy_invoke&lt;conv_impl&lt;false, MemAt, std::string(int)&gt;&gt;()</text>
  <line x1="32" y1="378" x2="424" y2="378" stroke="rgba(255,122,23,0.25)" stroke-width="1"/>
  <text x="48" y="391" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ pro::proxy&lt;Dictionary&gt;&amp;    + int</text>

  <!-- ══ U1 · 仍未知的一环 ══════════════════════════════════ -->
  <rect x="32" y="428" width="128" height="40" rx="8" fill="#191919"/>
  <rect x="32" y="428" width="128" height="40" rx="8" fill="#191919"
        stroke="rgba(255,255,255,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="48" y="452" fill="#7d8187" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">?</text>
  <text x="68" y="452" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">这一环仍未知</text>

  <!-- ══ N5 · std::map（最终落点） ═════════════════════════ -->
  <rect x="32" y="500" width="280" height="52" rx="8" fill="#191919"/>
  <rect x="32" y="500" width="280" height="52" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="48" y="522" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">std::map&lt;int, std::string&gt;</text>
  <line x1="32" y1="534" x2="312" y2="534" stroke="#212327" stroke-width="1"/>
  <text x="48" y="547" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ std::string at(int)</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="32" y1="584" x2="648" y2="584" stroke="#212327" stroke-width="0.8"/>
  <text x="32" y="604" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <line x1="112" y1="601" x2="136" y2="601" stroke="#7d8187" stroke-width="1.2"/>
  <text x="144" y="604" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">调用路径 / 指针位移回指</text>
  <rect x="288" y="594" width="24" height="14" rx="2" fill="none"
        stroke="rgba(255,255,255,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="320" y="604" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">尚未揭晓的一环</text>
  <rect x="404" y="595" width="12" height="12" rx="2" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="424" y="604" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">本图揭晓的一环：proxy_invoke</text>
</svg>
