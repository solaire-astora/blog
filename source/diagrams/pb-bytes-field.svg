<svg viewBox="0 0 680 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pb-bytes-field-title pb-bytes-field-desc">
  <title id="pb-bytes-field-title">Bytes 类型：先编码长度，再递归编码 message</title>
  <desc id="pb-bytes-field-desc">嵌套 message 的 value 段由长度前缀加数据组成：第一个 byte 00010010 是用 varint 编码的长度 18，随后的 00001010 00000101 01000011 等 18 个 byte 才是 NestedMessage 递归编码出的内容。</desc>

  <defs>
    <marker id="pb2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
  </defs>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ── 上下文标签 ─────────────────────────────────────────── -->
  <text x="40" y="28" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        letter-spacing="1.2">BYTES &#183; LEN + DATA &#183; nested = 3</text>

  <!-- ── 箭头（先画，z-order 在节点之下） ───────────────────── -->
  <line x1="100" y1="88" x2="100" y2="160" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb2-arrow)"/>
  <line x1="400" y1="88" x2="400" y2="160" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb2-arrow)"/>

  <!-- ── 箭头标签（mask 落在节点框之外的空白段） ────────────── -->
  <rect x="112" y="108" width="72" height="12" rx="2" fill="#191919"/>
  <text x="116" y="117" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">LEN &#183; varint</text>

  <rect x="412" y="108" width="128" height="12" rx="2" fill="#191919"/>
  <text x="416" y="117" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">DATA &#183; 18 bytes</text>

  <!-- ══ S1 · 字节流条（hairline 分隔的连续 byte 格） ════════ -->
  <rect x="40" y="48" width="600" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="48" width="600" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <rect x="40" y="48" width="120" height="40" rx="8" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <line x1="160" y1="48" x2="160" y2="88" stroke="#212327" stroke-width="1"/>
  <line x1="280" y1="48" x2="280" y2="88" stroke="#212327" stroke-width="1"/>
  <line x1="400" y1="48" x2="400" y2="88" stroke="#212327" stroke-width="1"/>
  <line x1="520" y1="48" x2="520" y2="88" stroke="#212327" stroke-width="1"/>
  <text x="100" y="72" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00010010</text>
  <text x="220" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00001010</text>
  <text x="340" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00000101</text>
  <text x="460" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">01000011</text>
  <text x="580" y="72" fill="#7d8187" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">....</text>

  <!-- ══ N1 · 长度（焦点） ══════════════════════════════════ -->
  <rect x="40" y="160" width="176" height="52" rx="8" fill="#191919"/>
  <rect x="40" y="160" width="176" height="52" rx="8" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="56" y="182" fill="#ff7a17" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">18</text>
  <line x1="40" y1="194" x2="216" y2="194" stroke="rgba(255,122,23,0.25)" stroke-width="1"/>
  <text x="56" y="207" fill="#dadbdf" font-size="8" font-family="'Inter', sans-serif">NestedMessage 的字节长度</text>

  <!-- ══ N2 · 递归编码出的 message 内容 ═════════════════════ -->
  <rect x="248" y="160" width="392" height="52" rx="8" fill="#191919"/>
  <rect x="248" y="160" width="392" height="52" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="264" y="182" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">NestedMessage</text>
  <line x1="248" y1="194" x2="640" y2="194" stroke="#212327" stroke-width="1"/>
  <text x="264" y="207" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">{"country": "China", "code": -10086}</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="40" y1="248" x2="640" y2="248" stroke="#212327" stroke-width="0.8"/>
  <text x="40" y="268" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <rect x="120" y="260" width="12" height="12" rx="2" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="140" y="268" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">长度前缀，用 varint 编码</text>
  <rect x="304" y="260" width="12" height="12" rx="2" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="324" y="268" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">数据段，递归编码的 message 内容</text>
</svg>
