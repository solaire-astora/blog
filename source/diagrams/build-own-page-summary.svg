<svg viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-own-page-summary-title build-own-page-summary-desc">
  <title id="build-own-page-summary-title">AI 构建个人主页的最小闭环</title>
  <desc id="build-own-page-summary-desc">流程图展示用 AI 构建个人主页的闭环：先写内容，保留 Markdown 内容层，再确定设计规则，让 AI 生成和小步修改，最后通过浏览器验收；验收失败就回到修改，验收通过后发布并继续维护。</desc>

  <defs>
    <marker id="bop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
    <marker id="bop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff7a17"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#191919"/>

  <line x1="340" y1="76" x2="340" y2="104" stroke="#7d8187" stroke-width="1.2" marker-end="url(#bop-arrow)"/>
  <line x1="340" y1="164" x2="340" y2="196" stroke="#7d8187" stroke-width="1.2" marker-end="url(#bop-arrow)"/>
  <line x1="340" y1="256" x2="340" y2="288" stroke="#7d8187" stroke-width="1.2" marker-end="url(#bop-arrow)"/>
  <line x1="340" y1="348" x2="340" y2="372" stroke="#7d8187" stroke-width="1.2" marker-end="url(#bop-arrow)"/>
  <line x1="340" y1="444" x2="340" y2="480" stroke="#ff7a17" stroke-width="1.2" marker-end="url(#bop-arrow-accent)"/>
  <path d="M244 408 H112 Q104 408 104 400 V320 Q104 312 112 312 H196" fill="none" stroke="#7d8187" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#bop-arrow)"/>

  <rect x="356" y="456" width="32" height="12" rx="2" fill="#191919"/>
  <text x="372" y="465" fill="#ff7a17" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="1.2">YES</text>
  <rect x="132" y="388" width="56" height="12" rx="2" fill="#191919"/>
  <text x="160" y="397" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="1.2">NO / TUNE</text>

  <rect x="244" y="32" width="192" height="44" rx="22" fill="#191919"/>
  <rect x="244" y="32" width="192" height="44" rx="22" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="340" y="59" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">内容先行</text>

  <rect x="196" y="104" width="288" height="60" rx="8" fill="#191919"/>
  <rect x="196" y="104" width="288" height="60" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="212" y="124" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">CONTENT</text>
  <text x="340" y="139" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">Markdown 做内容层</text>
  <text x="340" y="155" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">source/_posts/*.md</text>

  <rect x="196" y="196" width="288" height="60" rx="8" fill="#191919"/>
  <rect x="196" y="196" width="288" height="60" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="212" y="216" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">STYLE</text>
  <text x="340" y="231" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">确定设计规则</text>
  <text x="340" y="247" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">参考站 / design.md / skill</text>

  <rect x="196" y="288" width="288" height="60" rx="8" fill="#191919"/>
  <rect x="196" y="288" width="288" height="60" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="212" y="308" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">BUILD</text>
  <text x="340" y="323" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">AI 生成与小步修改</text>
  <text x="340" y="339" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">页面 / 交互 / 样式</text>

  <polygon points="340,372 436,408 340,444 244,408" fill="#191919"/>
  <polygon points="340,372 436,408 340,444 244,408" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="340" y="404" fill="#ff7a17" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">浏览器验收</text>
  <text x="340" y="420" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">screenshot / feedback</text>

  <rect x="244" y="480" width="192" height="44" rx="22" fill="#191919"/>
  <rect x="244" y="480" width="192" height="44" rx="22" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="340" y="507" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">发布后继续维护</text>

  <line x1="32" y1="544" x2="648" y2="544" stroke="#212327" stroke-width="0.8"/>
  <text x="32" y="564" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <line x1="112" y1="561" x2="136" y2="561" stroke="#7d8187" stroke-width="1.2"/>
  <text x="144" y="564" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">主流程</text>
  <line x1="216" y1="561" x2="240" y2="561" stroke="#7d8187" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="248" y="564" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">不满意就回到修改</text>
  <line x1="392" y1="561" x2="416" y2="561" stroke="#ff7a17" stroke-width="1.2"/>
  <text x="424" y="564" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">验收通过</text>
</svg>
