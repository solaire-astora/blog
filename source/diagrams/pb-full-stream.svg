<svg viewBox="0 0 680 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pb-full-stream-title pb-full-stream-desc">
  <title id="pb-full-stream-title">test.bin 的完整字节流分解</title>
  <desc id="pb-full-stream-desc">MyMessage 序列化后共 27 个 byte，由三段 k-v 依次拼接：byte 0-4 的 00001010 加 00000011 00110001 00110010 00110011 是 {Num:1 Type:2} 与 string("123")；byte 5-6 的 00010000 加 00001010 是 {Num:2 Type:0} 与 uint64(10)；byte 7-26 的 00011010 后接 00010010 00001010 00000101 01000011 等，是 {Num:3 Type:2} 与长度 18 的 NestedMessage。</desc>

  <defs>
    <marker id="pb3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
  </defs>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ── 上下文标签 ─────────────────────────────────────────── -->
  <text x="40" y="28" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        letter-spacing="1.2">test.bin &#183; MyMessage &#183; 27 bytes &#183; k-v segments concatenated</text>

  <!-- ── 箭头（先画，z-order 在节点之下） ───────────────────── -->
  <line x1="92" y1="100" x2="92" y2="124" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>
  <line x1="400" y1="100" x2="400" y2="124" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>
  <line x1="92" y1="240" x2="92" y2="264" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>
  <line x1="220" y1="240" x2="220" y2="264" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>
  <line x1="92" y1="380" x2="92" y2="404" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>
  <line x1="400" y1="380" x2="400" y2="404" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb3-arrow)"/>

  <!-- ── 箭头标签（mask 落在两行卡片之间的空白段） ──────────── -->
  <rect x="104" y="104" width="32" height="12" rx="2" fill="#191919"/>
  <text x="108" y="113" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">K</text>

  <rect x="412" y="104" width="32" height="12" rx="2" fill="#191919"/>
  <text x="416" y="113" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">V</text>

  <!-- ══ G1 · string name = 1 ═══════════════════════════════ -->
  <text x="40" y="52" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">FIELD 1 &#183; string name = 1 &#183; byte 0-4</text>

  <rect x="40" y="60" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="60" width="104" height="40" rx="8" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="92" y="84" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00001010</text>

  <rect x="160" y="60" width="480" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="60" width="480" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="280" y1="60" x2="280" y2="100" stroke="#212327" stroke-width="1"/>
  <line x1="400" y1="60" x2="400" y2="100" stroke="#212327" stroke-width="1"/>
  <line x1="520" y1="60" x2="520" y2="100" stroke="#212327" stroke-width="1"/>
  <text x="220" y="84" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00000011</text>
  <text x="340" y="84" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00110001</text>
  <text x="460" y="84" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00110010</text>
  <text x="580" y="84" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00110011</text>

  <rect x="40" y="124" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="124" width="104" height="40" rx="8" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="92" y="148" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:1 Type:2}</text>

  <rect x="160" y="124" width="480" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="124" width="480" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="400" y="148" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">len(3) + string("123")</text>

  <!-- ══ G2 · uint32 age = 2 ════════════════════════════════ -->
  <text x="40" y="192" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">FIELD 2 &#183; uint32 age = 2 &#183; byte 5-6</text>

  <rect x="40" y="200" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="200" width="104" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="92" y="224" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00010000</text>

  <rect x="160" y="200" width="120" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="200" width="120" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="220" y="224" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00001010</text>

  <rect x="40" y="264" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="264" width="104" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="92" y="288" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:2 Type:0}</text>

  <rect x="160" y="264" width="120" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="264" width="120" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="220" y="288" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">uint64(10)</text>

  <!-- ══ G3 · repeated NestedMessage nested = 3 ═════════════ -->
  <text x="40" y="332" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">FIELD 3 &#183; repeated NestedMessage nested = 3 &#183; byte 7-26</text>

  <rect x="40" y="340" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="340" width="104" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="92" y="364" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00011010</text>

  <rect x="160" y="340" width="480" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="340" width="480" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="256" y1="340" x2="256" y2="380" stroke="#212327" stroke-width="1"/>
  <line x1="352" y1="340" x2="352" y2="380" stroke="#212327" stroke-width="1"/>
  <line x1="448" y1="340" x2="448" y2="380" stroke="#212327" stroke-width="1"/>
  <line x1="544" y1="340" x2="544" y2="380" stroke="#212327" stroke-width="1"/>
  <text x="208" y="364" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00010010</text>
  <text x="304" y="364" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00001010</text>
  <text x="400" y="364" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00000101</text>
  <text x="496" y="364" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">01000011</text>
  <text x="592" y="364" fill="#7d8187" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">....</text>

  <rect x="40" y="404" width="104" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="404" width="104" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="92" y="428" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:3 Type:2}</text>

  <rect x="160" y="404" width="480" height="40" rx="8" fill="#191919"/>
  <rect x="160" y="404" width="480" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="400" y="428" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">len(18) + NestedMessage{"China", -10086}</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="40" y1="460" x2="640" y2="460" stroke="#212327" stroke-width="0.8"/>
  <text x="40" y="480" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <rect x="120" y="472" width="12" height="12" rx="2" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="140" y="480" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">k 部分示范：Num 与 Type 编码在同一 byte</text>
  <line x1="404" y1="477" x2="428" y2="477" stroke="#7d8187" stroke-width="1.2"/>
  <text x="436" y="480" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">上行原始字节，下行语义解释</text>
</svg>
