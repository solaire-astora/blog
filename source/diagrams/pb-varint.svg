<svg viewBox="0 0 680 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pb-varint-title pb-varint-desc">
  <title id="pb-varint-title">varint 编码 123456 的三步演进</title>
  <desc id="pb-varint-desc">123456 的 uint64 位串先按 7 bit 一组切成 000 0111 / 100 0100 / 100 0000，再按小端序逆序为 100 0000 / 100 0100 / 000 0111，最后每组补上 msb 得到 3 个 byte：1100 0000、1100 0100、0000 0111，其中前两个 byte 的 msb 为 1、末 byte 为 0。</desc>

  <defs>
    <marker id="pb1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
  </defs>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ── 上下文标签 ─────────────────────────────────────────── -->
  <text x="32" y="28" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        letter-spacing="1.2">VARINT &#183; 123456 &#183; uint64 = 00011110001001000000</text>

  <!-- ── 箭头（先画，z-order 在节点之下） ───────────────────── -->
  <line x1="200" y1="88" x2="200" y2="120" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb1-arrow)"/>
  <line x1="200" y1="160" x2="200" y2="192" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb1-arrow)"/>

  <!-- ══ R1 · 7 bit 分组 ════════════════════════════════════ -->
  <text x="32" y="72" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">01</text>
  <rect x="56" y="48" width="288" height="40" rx="8" fill="#191919"/>
  <rect x="56" y="48" width="288" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="152" y1="48" x2="152" y2="88" stroke="#212327" stroke-width="1"/>
  <line x1="248" y1="48" x2="248" y2="88" stroke="#212327" stroke-width="1"/>
  <text x="104" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">000 0111</text>
  <text x="200" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">100 0100</text>
  <text x="296" y="72" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">100 0000</text>
  <text x="368" y="72" fill="#dadbdf" font-size="8" font-family="'Inter', sans-serif">按 7 bit 一组切分，高位组在前</text>

  <!-- ══ R2 · 小端序 ════════════════════════════════════════ -->
  <text x="32" y="144" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">02</text>
  <rect x="56" y="120" width="288" height="40" rx="8" fill="#191919"/>
  <rect x="56" y="120" width="288" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="152" y1="120" x2="152" y2="160" stroke="#212327" stroke-width="1"/>
  <line x1="248" y1="120" x2="248" y2="160" stroke="#212327" stroke-width="1"/>
  <text x="104" y="144" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">100 0000</text>
  <text x="200" y="144" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">100 0100</text>
  <text x="296" y="144" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">000 0111</text>
  <text x="368" y="144" fill="#dadbdf" font-size="8" font-family="'Inter', sans-serif">小端序：低位组排在前面</text>

  <!-- ══ R3 · 补 msb（焦点） ════════════════════════════════ -->
  <text x="32" y="216" fill="#7d8187" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">03</text>
  <rect x="56" y="192" width="288" height="40" rx="8" fill="#191919"/>
  <rect x="56" y="192" width="288" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="152" y1="192" x2="152" y2="232" stroke="#212327" stroke-width="1"/>
  <line x1="248" y1="192" x2="248" y2="232" stroke="#212327" stroke-width="1"/>
  <text x="104" y="216" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#ff7a17">1</tspan>100 0000</text>
  <text x="200" y="216" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#ff7a17">1</tspan>100 0100</text>
  <text x="296" y="216" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#ff7a17">0</tspan>000 0111</text>
  <text x="368" y="216" fill="#dadbdf" font-size="8" font-family="'Inter', sans-serif">每组补上 msb，凑成 3 个 byte</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="32" y1="264" x2="648" y2="264" stroke="#212327" stroke-width="0.8"/>
  <text x="32" y="284" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <rect x="112" y="276" width="12" height="12" rx="2" fill="rgba(255,122,23,0.06)" stroke="#ff7a17" stroke-width="1"/>
  <text x="132" y="284" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">msb 位：1 表示后续还有 byte，0 表示末 byte</text>
  <rect x="424" y="276" width="12" height="12" rx="2" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="444" y="284" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">每格 = 一个 7 bit 组 / byte</text>
</svg>
