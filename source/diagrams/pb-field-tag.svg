<svg viewBox="0 0 680 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pb-field-tag-title pb-field-tag-desc">
  <title id="pb-field-tag-title">field 的 tag byte：高 5 位是 Num，低 3 位是 Type</title>
  <desc id="pb-field-tag-desc">三个 tag byte 的位切分：00001 加 010 得 {Num:1 Type:2}，00010 加 000 得 {Num:2 Type:0}，00011 加 010 得 {Num:3 Type:2}。低 3 位是 wire type，field = Num 左移 3 位再或上 Type。</desc>

  <defs>
    <marker id="pb4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
  </defs>

  <!-- ── 画布 ───────────────────────────────────────────────── -->
  <rect width="100%" height="100%" fill="#191919"/>

  <!-- ── 上下文标签 ─────────────────────────────────────────── -->
  <text x="40" y="28" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        letter-spacing="1.2">FIELD TAG &#183; field = Num&lt;&lt;3 | Type</text>

  <!-- ── 箭头（先画，z-order 在节点之下） ───────────────────── -->
  <line x1="132" y1="92" x2="132" y2="124" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb4-arrow)"/>
  <line x1="340" y1="92" x2="340" y2="124" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb4-arrow)"/>
  <line x1="548" y1="92" x2="548" y2="124" stroke="#7d8187" stroke-width="1.2" marker-end="url(#pb4-arrow)"/>

  <!-- ══ G1 · string name = 1 ═══════════════════════════════ -->
  <rect x="40" y="52" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="52" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="144" y1="52" x2="144" y2="92" stroke="#212327" stroke-width="1"/>
  <text x="92" y="76" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00001</text>
  <text x="184" y="76" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">010</text>

  <rect x="40" y="124" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="40" y="124" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="132" y="148" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:1 Type:2}</text>

  <!-- ══ G2 · uint32 age = 2 ════════════════════════════════ -->
  <rect x="248" y="52" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="248" y="52" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="352" y1="52" x2="352" y2="92" stroke="#212327" stroke-width="1"/>
  <text x="300" y="76" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00010</text>
  <text x="392" y="76" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">000</text>

  <rect x="248" y="124" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="248" y="124" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="340" y="148" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:2 Type:0}</text>

  <!-- ══ G3 · repeated NestedMessage nested = 3 ═════════════ -->
  <rect x="456" y="52" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="456" y="52" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <line x1="560" y1="52" x2="560" y2="92" stroke="#212327" stroke-width="1"/>
  <text x="508" y="76" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">00011</text>
  <text x="600" y="76" fill="#ff7a17" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">010</text>

  <rect x="456" y="124" width="184" height="40" rx="8" fill="#191919"/>
  <rect x="456" y="124" width="184" height="40" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="548" y="148" fill="#dadbdf" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">{Num:3 Type:2}</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="40" y1="188" x2="640" y2="188" stroke="#212327" stroke-width="0.8"/>
  <text x="40" y="208" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.4">LEGEND</text>
  <text x="120" y="208" fill="#ffffff" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">00001</text>
  <text x="164" y="208" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">高 5 位：field Num</text>
  <text x="288" y="208" fill="#ff7a17" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">010</text>
  <text x="316" y="208" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">低 3 位：wire Type</text>
</svg>
