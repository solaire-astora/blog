  <text x="16" y="40" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">KNOWN</text>
  <text x="60" y="40" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">调用起点</text>

  <text x="484" y="40" fill="#7d8187" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="1.2">KNOWN</text>
  <text x="528" y="40" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">最终落点</text>

  <!-- ── 箭头（先画，z-order 在节点之下；全部同轴 y=76） ────── -->
  <line x1="172" y1="76" x2="196" y2="76" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="228" y1="76" x2="252" y2="76" stroke="#7d8187" stroke-width="1.2"
        stroke-dasharray="4,4" marker-end="url(#d1-arrow)"/>
  <line x1="348" y1="76" x2="372" y2="76" stroke="#7d8187" stroke-width="1.2"
        stroke-dasharray="4,4" marker-end="url(#d1-arrow)"/>
  <line x1="404" y1="76" x2="428" y2="76" stroke="#7d8187" stroke-width="1.2"
        stroke-dasharray="4,4" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="76" x2="484" y2="76" stroke="#7d8187" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- ══ 左端 · pro::proxy<Dictionary>（已知） ═══════════════ -->
  <rect x="16" y="48" width="156" height="56" rx="8" fill="#191919"/>
  <rect x="16" y="48" width="156" height="56" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="28" y="68" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">pro::proxy&lt;Dictionary&gt;</text>
  <line x1="16" y1="80" x2="172" y2="80" stroke="#212327" stroke-width="1"/>
  <text x="28" y="96" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ operator-&gt;()</text>

