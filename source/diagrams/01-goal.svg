<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goal-title goal-desc">
  <title id="goal-title">本文的目标：找到 proxy 与 std::map 之间的路径</title>
  <desc id="goal-desc">横向问题陈述图：左端是已知的 pro::proxy&lt;Dictionary&gt;，右端是已知的 std::map&lt;int, std::string&gt; 及其 at 方法；中间由三个虚线的未知节点和一个只知道带 at(int) 的未知类串联，橙色虚线括号标出这段未知路径正是本文要揭示的内容。</desc>

  <defs>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
