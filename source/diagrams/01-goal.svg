  <!-- ══ 未知类 · 只知道它带 at(int) ═════════════════════════ -->
  <rect x="252" y="48" width="96" height="56" rx="8" fill="none"
        stroke="#7d8187" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="264" y="68" fill="#7d8187" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">???</text>
  <line x1="252" y1="80" x2="348" y2="80" stroke="#212327" stroke-width="1"/>
  <text x="264" y="96" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ at(int)</text>

  <!-- ══ 未知节点 2 ═════════════════════════════════════════ -->
  <rect x="372" y="60" width="32" height="32" rx="8" fill="none"
