  <rect x="80" y="176" width="12" height="12" rx="2" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="100" y="184" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">已知两端</text>
  <rect x="152" y="176" width="12" height="12" rx="2" fill="none"
