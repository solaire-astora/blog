  <text x="388" y="80" fill="#7d8187" font-size="12" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">?</text>

  <!-- ══ 未知节点 3 ═════════════════════════════════════════ -->
  <rect x="428" y="60" width="32" height="32" rx="8" fill="none"
        stroke="#7d8187" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="444" y="80" fill="#7d8187" font-size="12" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">?</text>

  <!-- ══ 右端 · std::map<int, std::string>（已知） ══════════ -->
  <rect x="484" y="48" width="180" height="56" rx="8" fill="#191919"/>
  <rect x="484" y="48" width="180" height="56" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="496" y="68" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">std::map&lt;int, std::string&gt;</text>
  <line x1="484" y1="80" x2="664" y2="80" stroke="#212327" stroke-width="1"/>
  <text x="496" y="96" fill="#dadbdf" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">+ std::string at(int)</text>

  <!-- ── 强调：未知路径的跨度括号（唯一强调色） ─────────────── -->
  <line x1="184" y1="124" x2="472" y2="124" stroke="#ff7a17" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="184" y1="120" x2="184" y2="128" stroke="#ff7a17" stroke-width="0.8"/>
  <line x1="472" y1="120" x2="472" y2="128" stroke="#ff7a17" stroke-width="0.8"/>
  <rect x="292" y="132" width="72" height="16" rx="2" fill="#191919"/>
  <text x="296" y="144" fill="#ff7a17" font-size="8" font-family="'Inter', sans-serif">本文要找的路径</text>

  <!-- ── 图例（底部横条） ──────────────────────────────────── -->
  <line x1="16" y1="164" x2="664" y2="164" stroke="#212327" stroke-width="0.8"/>
  <text x="16" y="184" fill="#7d8187" font-size="8"
