<svg viewBox="0 0 680 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cocosLaunchTitle cocosLaunchDesc">
  <title id="cocosLaunchTitle">Cocos 在 Android 上的启动时序</title>
  <desc id="cocosLaunchDesc">时序图：Cocos 使用 jetpack 原生的 GameActivity 作为入口，GameActivity_onCreate 进入 app_native_glue，glue 调用 android_app_create 后用 pthread_create 建立 Game Thread，Game Thread 经 android_app_entry 回到 glue，再调用 android_main 进入 LaunchAndroid。与 UE4 不同，Cocos 没有再额外创建事件交互线程，安卓事件在 game loop 内处理。</desc>

  <defs>
    <marker id="clsArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7d8187"/>
    </marker>
    <marker id="clsArrowSun" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff7a17"/>
    </marker>
    <!-- 空心箭头 = 创建线程：调用方不等它返回 -->
    <marker id="clsArrowOpen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polyline points="1 1, 8 3.5, 1 6" fill="none" stroke="#7d8187" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="680" height="616" fill="#191919"/>

  <!-- ═══ 区域框 ═══════════════════════════════════════════════ -->
  <rect x="16" y="48" width="320" height="388" rx="8"
        fill="#ffffff" fill-opacity="0.015"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="32" y="40" width="60" height="16" fill="#191919"/>
  <text x="40" y="52" fill="#7d8187" font-size="8" letter-spacing="1.2"
        font-family="'JetBrains Mono', ui-monospace, monospace">ANDROID</text>

  <rect x="348" y="48" width="316" height="388" rx="8"
        fill="#ffffff" fill-opacity="0.015"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="364" y="40" width="48" height="16" fill="#191919"/>
  <text x="372" y="52" fill="#7d8187" font-size="8" letter-spacing="1.2"
        font-family="'JetBrains Mono', ui-monospace, monospace">COCOS</text>

  <!-- ═══ 生命线 ═══════════════════════════════════════════════ -->
  <line x1="88"  y1="116" x2="88"  y2="424" stroke="#212327" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="248" y1="116" x2="248" y2="424" stroke="#212327" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="428" y1="116" x2="428" y2="424" stroke="#212327" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="588" y1="116" x2="588" y2="424" stroke="#212327" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- ═══ 激活条
       Game Thread 的条在 android_app_entry 之后就收住：此后代码虽仍跑在
       这条线程上，但控制权已交回 glue，由它继续调 android_main。 ══════ -->
  <rect x="84"  y="148" width="8" height="76"  fill="#26282c" stroke="#212327" stroke-width="0.8"/>
  <rect x="244" y="188" width="8" height="196" fill="#26282c" stroke="#212327" stroke-width="0.8"/>
  <rect x="424" y="264" width="8" height="56"  fill="#26282c" stroke="#212327" stroke-width="0.8"/>
  <rect x="584" y="368" width="8" height="48"  fill="#26282c" stroke="#212327" stroke-width="0.8"/>

  <!-- ═══ 消息 ═════════════════════════════════════════════════ -->

  <!-- 1 · GameActivity → glue：jetpack 原生 GameActivity 的 onCreate -->
  <line x1="92" y1="188" x2="240" y2="188" stroke="#7d8187" stroke-width="1.2" marker-end="url(#clsArrow)"/>
  <rect x="96" y="168" width="126" height="12" fill="#191919"/>
  <text x="96" y="177" fill="#dadbdf" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace">GameActivity_onCreate</text>

  <!-- 2 · glue 自调用 android_app_create -->
  <path d="M 252,216 H 280 Q 288,216 288,224 V 228 Q 288,236 280,236 H 256"
        fill="none" stroke="#7d8187" stroke-width="1.2" marker-end="url(#clsArrow)"/>
  <rect x="296" y="217" width="98" height="12" fill="#191919"/>
  <text x="296" y="226" fill="#dadbdf" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace">android_app_create</text>

  <!-- 3 · glue → Game Thread：创建 game 线程，不等返回 -->
  <line x1="252" y1="264" x2="420" y2="264" stroke="#7d8187" stroke-width="1.2"
        stroke-dasharray="4,3" marker-end="url(#clsArrowOpen)"/>
  <rect x="272" y="244" width="80" height="12" fill="#191919"/>
  <text x="272" y="253" fill="#dadbdf" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace">pthread_create</text>

  <!-- 4 · Game Thread → glue：新线程从这里进入 glue 的代码 -->
  <line x1="424" y1="312" x2="256" y2="312" stroke="#7d8187" stroke-width="1"
        stroke-dasharray="4,3" marker-end="url(#clsArrow)"/>
  <rect x="284" y="292" width="94" height="12" fill="#191919"/>
  <text x="284" y="301" fill="#dadbdf" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace">android_app_entry</text>

  <!-- 5 · glue → LaunchAndroid：引擎入口，与 UE4 同一个题眼 -->
  <line x1="252" y1="368" x2="580" y2="368" stroke="#ff7a17" stroke-width="1.2" marker-end="url(#clsArrowSun)"/>
  <rect x="380" y="348" width="72" height="12" fill="#191919"/>
  <text x="380" y="357" fill="#ff7a17" font-size="8"
        font-family="'JetBrains Mono', ui-monospace, monospace">android_main</text>

  <!-- ═══ 参与者盒子 ═══════════════════════════════════════════ -->
  <rect x="40" y="80" width="96" height="36" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="88" y="96" fill="#ffffff" font-size="8" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">GameActivity</text>
  <text x="88" y="108" fill="#7d8187" font-size="7" text-anchor="middle" letter-spacing="0.8"
        font-family="'JetBrains Mono', ui-monospace, monospace">JETPACK</text>

  <rect x="196" y="80" width="104" height="36" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="248" y="102" fill="#ffffff" font-size="8" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">app_native_glue</text>

  <rect x="380" y="80" width="96" height="36" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="428" y="96" fill="#ffffff" font-size="8" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">Game Thread</text>
  <text x="428" y="108" fill="#7d8187" font-size="7" text-anchor="middle" letter-spacing="0.8"
        font-family="'JetBrains Mono', ui-monospace, monospace">NEW THREAD</text>

  <!-- LaunchAndroid：引擎入口，橙色只给它和 android_main -->
  <rect x="540" y="80" width="96" height="36" rx="8"
        fill="#ff7a17" fill-opacity="0.06" stroke="#ff7a17" stroke-width="1"/>
  <text x="588" y="102" fill="#ff7a17" font-size="8" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace">LaunchAndroid</text>

  <!-- ═══ 对比标注：这张图相对上一张的差别，正文第 170 行的原话 ══ -->
  <line x1="588" y1="424" x2="588" y2="452" stroke="#363a3f" stroke-width="0.8" stroke-dasharray="2,3"/>
  <rect x="348" y="452" width="316" height="52" rx="8" fill="#212327" stroke="#363a3f" stroke-width="1"/>
  <text x="364" y="472" fill="#dadbdf" font-size="9" font-family="'Inter', sans-serif">没有再额外创建事件交互线程</text>
  <text x="364" y="490" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">安卓事件在 game loop 内处理 —— 官方推荐用法</text>

  <!-- ═══ 图例 ═════════════════════════════════════════════════ -->
  <line x1="32" y1="548" x2="648" y2="548" stroke="#212327" stroke-width="0.8"/>
  <text x="32" y="567" fill="#7d8187" font-size="8" letter-spacing="1.4"
        font-family="'JetBrains Mono', ui-monospace, monospace">LEGEND</text>

  <line x1="96" y1="564" x2="118" y2="564" stroke="#7d8187" stroke-width="1.2"/>
  <polygon points="118,561 124,564 118,567" fill="#7d8187"/>
  <text x="132" y="567" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">同步调用</text>

  <line x1="200" y1="564" x2="222" y2="564" stroke="#7d8187" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polyline points="222,561 228,564 222,567" fill="none" stroke="#7d8187" stroke-width="1.2"/>
  <text x="236" y="567" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">创建线程</text>

  <line x1="304" y1="564" x2="326" y2="564" stroke="#7d8187" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="326,561 332,564 326,567" fill="#7d8187"/>
  <text x="340" y="567" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">新线程进入</text>

  <line x1="424" y1="564" x2="446" y2="564" stroke="#ff7a17" stroke-width="1.2"/>
  <polygon points="446,561 452,564 446,567" fill="#ff7a17"/>
  <text x="460" y="567" fill="#7d8187" font-size="8" font-family="'Inter', sans-serif">进入引擎入口</text>
</svg>
